# merge.yml — the single merge authority for routine PRs.
#
# WHY THIS REPLACED AN AGENT
# This pass used to be an unattended LLM session following workflows/DAILY-MERGE.md. It made no
# judgement calls — merge-gate.js already decides scope, CI, staleness, drafts and prefix — so the
# agent added no decisions and three failure modes:
#   1. It could not run where it was scheduled. Measured 2026-07-30 in the cloud environment
#      (branch probe/cloud-auth-2026-07-30): `gh` is not installed, GITHUB_TOKEN reads as the literal
#      'proxy-injected', and while the API is authenticated through the egress proxy at 15000/hr, the
#      identity has permissions {admin:false, push:false, …}. Merging a PR is an API WRITE, so there
#      is no route to it from there. The local Mac task that preceded it depended on the Mac.
#   2. A stop left no artifact. persist_session=false, no run history, and the routine only wrote its
#      log line when it had something to merge — so a failed night was indistinguishable from a quiet
#      one. GitHub Actions keeps a permanent, timestamped log of every run, pass or fail.
#   3. The procedure lived in prose and drifted from the code (DAILY-MERGE.md described itself as
#      running "Local" for weeks after it moved to cloud).
#
# The decision still lives in tools/merge-gate.js and is still never made here.
name: merge

on:
  schedule:
    # Every 3 hours, not once at 11:00 UTC. A pass can merge any number of log-only PRs but only
    # ONE that rebuilds pages: merging it puts every other derived PR behind, and those must be
    # rebuilt and re-verified before they may merge. So capacity is one content PR per pass.
    #
    # Inflow is one content PR a night (daily-wave), plus a second on Mondays (weekly-discovery).
    # Against a single daily pass that is exactly break-even on six days and short by one on the
    # seventh — a Monday deficit that never clears, because tomorrow's pass spends its one content
    # slot on tomorrow's wave. Eight passes a day clears the Monday double and absorbs a missed run
    # without a human noticing.
    #
    # Cheap: the pass is idempotent, exits clean with nothing to do, and a gate() read costs ~14
    # REST calls per open PR against GH_TOKEN's 5000/hr. Concurrency group `merge-authority`
    # already serialises overlapping runs.
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      execute:
        description: 'Actually merge (unchecked = dry run)'
        type: boolean
        default: true

# Two runs merging at once would race exactly the way four routines did before the gate existed.
concurrency:
  group: merge-authority
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # token: MERGE_TOKEN so the credential left behind for `git push` is one whose pushes TRIGGER
      # verify.yml. A rebuild pushed with the default GITHUB_TOKEN never gets its required check and
      # the gate waits on it forever. fetch-depth: 0 because a rebuild merges origin/main into a
      # branch, which a shallow clone cannot do.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MERGE_TOKEN || github.token }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Identify the committer
        run: |
          git config user.name  "quotle merge authority"
          git config user.email "stewartdavidp@gmail.com"

      # The gate's own fixtures, before it is trusted to decide anything live.
      - name: Self-test the decision and execution paths
        run: |
          node tools/derived-paths.js --self-test
          node tools/merge-gate.js --self-test
          node tools/merge-run.js --self-test

      - name: Merge what the gate approves, and rebuild what is behind
        env:
          # MERGE_TOKEN performs the merge WRITE (tools/merge-run.js).
          MERGE_TOKEN: ${{ secrets.MERGE_TOKEN || github.token }}
          # GH_TOKEN authenticates the gate's READS (tools/gh-rest.js). Without it those go out
          # anonymous at 60/hr against a SHARED runner IP — the exact "403 before the first call"
          # that proxy-boot.js was written for. A merge pass that cannot see PRs must not be one
          # rate-limit away from reporting an empty queue.
          GH_TOKEN: ${{ secrets.MERGE_TOKEN || github.token }}
        run: node tools/merge-run.js ${{ (github.event_name == 'schedule' || inputs.execute) && '--execute' || '' }}

      # WHY MERGE_TOKEN IS NOT OPTIONAL FOR THE REBUILD HALF.
      # main is protected with strict:true and `verify` as a REQUIRED context, so a branch that is
      # BEHIND must be brought current, rebuilt, and pass `verify` on the NEW head before it can
      # merge. GitHub does not run workflows for pushes made with the default GITHUB_TOKEN — so a
      # rebuild pushed with it would never get its required check, the gate would report WAIT
      # forever, and that stall would look exactly like a quiet morning. That is the failure this
      # whole file exists to remove.
      #
      # Publishing our own `verify` check run from this workflow would satisfy protection without a
      # PAT, and was rejected: it would put a second definition of "verify" beside verify.yml, and
      # one rule with two readers is this repo's most-repeated defect.
      - name: State the pass's own preconditions
        if: always()
        run: |
          echo "MERGE_TOKEN configured: ${{ secrets.MERGE_TOKEN != '' }}"
          if [ "${{ secrets.MERGE_TOKEN != '' }}" != "true" ]; then
            echo "::warning::MERGE_TOKEN is not set. Merging still works, but any REBUILD pushed with the default GITHUB_TOKEN will never trigger verify.yml and will wait forever."
          fi
          node tools/merge-gate.js || true
